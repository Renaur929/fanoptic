<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FanOptic — Personalized Sports Coverage</title><style>:root{--g:#10251d;--d:#08130f;--c:#f3ead7;--y:#d7a84b;--m:#a9997b;--l:#3c4c40}*{box-sizing:border-box}body{margin:0;background:var(--d);color:var(--c);font:16px Georgia,serif}header{height:72px;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;background:var(--g);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:3}.brand{font:bold 30px Georgia;color:var(--y);letter-spacing:1px}.tag{font:12px Arial;color:var(--m);letter-spacing:2px;text-transform:uppercase}.btn{background:var(--y);color:#182019;border:0;border-radius:3px;padding:11px 16px;font-weight:bold;cursor:pointer}.ghost{background:transparent;color:var(--c);border:1px solid var(--y)}main{max-width:1180px;margin:auto;padding:26px 5%}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.hero h1{font-size:34px;margin:0 0 6px}.hero p{color:var(--m);margin:0}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}input{background:#192b22;color:var(--c);border:1px solid var(--l);padding:11px;border-radius:3px}#search{min-width:250px;flex:1}.grid{display:grid;grid-template-columns:1fr 285px;gap:22px}.card{background:var(--g);border:1px solid var(--l);padding:18px;margin-bottom:12px;border-radius:4px}.card h3{margin:0 0 8px;font-size:20px}.meta{font:12px Arial;color:var(--y);text-transform:uppercase;letter-spacing:1px}.card a{color:var(--c);text-decoration:none}.card a:hover{color:var(--y)}aside{background:#17271f;border:1px solid var(--l);padding:16px;height:max-content;position:sticky;top:90px}.score{border-bottom:1px solid var(--l);padding:12px 0;color:var(--m)}.score strong{display:block;color:var(--c)}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:5}.modal.open{display:grid}.box{background:var(--g);border:1px solid var(--y);padding:24px;width:min(600px,94vw);max-height:90vh;overflow:auto}.box h2{margin-top:0}.form{display:grid;gap:10px}.close{float:right;color:var(--m);cursor:pointer;font-size:22px}.notice{color:var(--y);min-height:20px;font:14px Arial}.pickerTop{display:flex;gap:8px;align-items:center;margin:12px 0 8px}.pickerTop input{flex:1;min-width:0}.leaguebar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.leaguebar button{padding:7px 10px}.selected{display:flex;gap:6px;flex-wrap:wrap;min-height:24px;margin:7px 0}.pill{background:#284636;color:var(--c);border:1px solid var(--y);border-radius:20px;padding:5px 9px;font:12px Arial}.teamlist{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:300px;overflow:auto;border-top:1px solid var(--l);padding-top:10px}.teamlist label{font:13px Arial;background:#1b3327;padding:9px;cursor:pointer;border:1px solid transparent}.teamlist label:hover{border-color:var(--y)}.teamlist input{accent-color:var(--y);padding:0;margin-right:4px}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{display:block}.hero .btn{margin-top:15px}aside{position:static}.teamlist{grid-template-columns:1fr}}.scoreTools{display:flex;gap:6px;margin:10px 0}.scoreFilters{display:grid;gap:7px;margin:8px 0 10px}.scoreFilters input{width:100%;padding:8px 9px;font-size:12px}.scoreLeagues{display:flex;gap:4px;flex-wrap:wrap}.scoreLeagues .btn{padding:6px 8px;font-size:10px}.scoreLeagues .btn.active{background:var(--y);color:#182019}.scoreLeagues .btn.ghost{background:transparent;color:var(--c)}.scoreTools .btn{padding:7px 9px;font-size:12px}.scorePage{display:flex;justify-content:space-between;align-items:center;margin:2px 0 4px;color:var(--m);font:12px Arial;text-transform:uppercase;letter-spacing:1px}.scoreArrow{padding:4px 8px!important}.scoreArrow:disabled{opacity:.35;cursor:not-allowed}.score strong{font-size:15px}.score small{display:block;margin-top:5px;color:var(--m);font:11px Arial;text-transform:none;letter-spacing:0}.scoreLine{color:var(--c);font-size:15px;margin:4px 0}.score.favorite{border-left:3px solid var(--y);padding-left:9px}.tickerWindow{display:inline-block;overflow:hidden;vertical-align:bottom}.flipChar{display:inline-block;min-width:.34em;animation:tickerFlip .48s cubic-bezier(.2,.75,.3,1) both;transform-origin:50% 0}.flipChar.space{min-width:.18em}@keyframes tickerFlip{0%{opacity:0;transform:translateY(-115%) rotateX(-80deg)}55%{opacity:1;transform:translateY(8%) rotateX(12deg)}100%{opacity:1;transform:translateY(0) rotateX(0)}}<style>aside{background:#11100f;border:1px solid #38312a;padding:14px;height:max-content;position:sticky;top:90px;box-shadow:0 8px 22px #0008}.grid{grid-template-columns:1fr 360px}.scoreboard{background:#0b0b0b;border:1px solid #393632;box-shadow:inset 0 0 0 4px #171614}.score{border-bottom:1px solid #35322e;padding:11px 9px 13px;color:var(--m);background:#11100f}.score:last-child{border-bottom:0}.score.favorite{border-left:4px solid var(--y);padding-left:6px}.boardMeta{font:500 12px/1.2 "Helvetica Neue",Arial,sans-serif;letter-spacing:1.4px;text-transform:uppercase;color:var(--y);margin-bottom:6px}.tileLine,.boardSub{display:flex;flex-wrap:wrap;gap:0;line-height:1}.flapTile{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:24px;background:#171616;color:#f3ead7;border:1px solid #35302d;border-top-color:#514a45;font:700 12px/1 "Courier New",monospace;text-transform:uppercase;box-shadow:inset 0 2px 0 #262321,inset 0 -3px 0 #090909;perspective:180px;animation:flapIn .42s cubic-bezier(.2,.75,.3,1) both}.flapTile:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#07150f;box-shadow:0 1px #234535}.flapTile span{position:relative;z-index:1}.flapTile.space{background:#0b0b0b;border-color:#0b0b0b;width:8px}.boardSub{margin-top:5px}.boardSub .flapTile{width:16px;height:20px;font-size:10px;color:#d7a84b}.boardSub .flapTile.space{width:6px}.boardUpdated{font:500 9px/1.2 "Helvetica Neue",Arial,sans-serif;letter-spacing:.7px;color:#a9997b;margin-top:7px;text-transform:uppercase}@keyframes flapIn{0%{opacity:1;transform:rotateX(-86deg);filter:brightness(1.7)}55%{opacity:1;transform:rotateX(12deg);filter:brightness(1.25)}100%{opacity:1;transform:rotateX(0);filter:brightness(1)}}@media(max-width:800px){.grid{grid-template-columns:1fr}aside{position:static}.flapTile{width:19px;height:25px}.boardSub .flapTile{width:17px}}</style></style><style>.flapTile{animation:none!important;transform:none!important;transform-style:preserve-3d;overflow:hidden}.flapGlyph{display:inline-block;position:relative;z-index:1;backface-visibility:hidden;transform-style:preserve-3d;animation:characterFlip .78s cubic-bezier(.22,.75,.26,1) both}@keyframes characterFlip{0%{transform:rotateX(0deg);opacity:1}42%{transform:rotateX(-90deg);opacity:.35}50%{transform:rotateX(-180deg);opacity:.15}58%{transform:rotateX(-270deg);opacity:.35}100%{transform:rotateX(-360deg);opacity:1}}</style><style>.tileLine{display:flex;flex-wrap:wrap;align-items:flex-start;gap:3px}.tileTeam{display:flex;flex-wrap:wrap;align-items:flex-start;max-width:100%;min-width:0}.tileWord{display:inline-flex;flex:0 0 auto;white-space:nowrap}.teamSpace{display:inline-block;width:7px;flex:0 0 7px}.tileAt{display:inline-flex;flex:0 0 auto;height:24px;align-items:center;color:#f3ead7;font:700 15px/1 "Courier New",monospace}.boardSub{display:flex;flex-wrap:wrap;align-items:flex-start;gap:0}.boardSub .tileWord{display:inline-flex}.boardSub .teamSpace{width:5px;flex-basis:5px}</style><style>aside{background:var(--g);border-color:var(--l)}.scoreboard{background:var(--g);border:1px solid var(--l);box-shadow:none}.score{background:transparent;border-bottom:1px solid var(--l)}.score:last-child{border-bottom:0}.flapTile{background:var(--g);border-color:#142d22;border-top-color:#1f4533;box-shadow:inset 0 2px 0 #163426,inset 0 -3px 0 #07140e}.flapTile.space{background:var(--g);border-color:var(--g)}.boardMeta{color:var(--y)}.score.favorite{border-left-color:var(--y)}</style><style>.flapTile{perspective:520px}.flapGlyph{animation-duration:.78s!important;transform-origin:50% 50%;will-change:transform,opacity}</style><style>.phaseTicker{display:inline-flex;vertical-align:middle}.phaseTicker .flapTile{width:14px;height:18px;font-size:9px;color:var(--y)}.liveStatus{font:600 10px/1.2 Arial,sans-serif;letter-spacing:1px;color:var(--y);text-transform:uppercase}.liveScore{display:inline-flex;align-items:center;margin-left:6px}.teamResult{display:inline-flex;align-items:center;justify-content:center;margin-left:5px;width:17px;height:17px;border-radius:50%;font:700 10px Arial;background:var(--y);color:#182019}.teamResult.loss{background:transparent;color:var(--m);border:1px solid var(--m)}.tileTeam.winner{color:var(--y)}</style></head><body><header><div><div class="brand">FANOPTIC</div><div class="tag">Personalized sports coverage</div></div><div><button class="btn ghost" id="loginBtn">Log in</button> <button class="btn" id="signupBtn">Create account</button></div></header><main><section class="hero"><div><h1 id="greeting">The sports desk, your way.</h1><p id="sub">National headlines now. Pick your teams when you are ready.</p></div><div class="tag">San Francisco • free to use</div></section><div class="tools"><input id="search" placeholder="Search teams, leagues, or headlines"><button class="btn tab" data-league="All">All</button><button class="btn ghost tab" data-league="NFL">NFL</button><button class="btn ghost tab" data-league="NBA">NBA</button><button class="btn ghost tab" data-league="MLB">MLB</button><button class="btn ghost tab" data-league="NHL">NHL</button></div><div class="grid"><section><div id="feed"></div></section><aside><div style="display:flex;justify-content:space-between;align-items:center"><b id="scoreTitle">TODAY'S GAMES</b><button class="btn ghost" id="hideScores">Hide</button></div><div class="scoreTools"><button class="btn scoreMode" data-scoremode="today">Today</button><button class="btn ghost scoreMode" data-scoremode="week">This week</button></div><div class="scoreFilters"><input id="scoreSearch" placeholder="Search teams"><div class="scoreLeagues"><button class="btn scoreLeague active" data-scoreleague="All">All</button><button class="btn scoreLeague ghost" data-scoreleague="NFL">NFL</button><button class="btn scoreLeague ghost" data-scoreleague="NBA">NBA</button><button class="btn scoreLeague ghost" data-scoreleague="MLB">MLB</button><button class="btn scoreLeague ghost" data-scoreleague="NHL">NHL</button></div></div><div class="scorePage"><button class="btn ghost scoreArrow" id="scorePrev" aria-label="Previous games">‹</button><span id="scorePage">1 / 2</span><button class="btn ghost scoreArrow" id="scoreNext" aria-label="Next games">›</button></div><div id="scores"></div></aside></div></main><div class="modal" id="modal"><div class="box"><span class="close" id="close">×</span><h2 id="modalTitle">Create your FanOptic account</h2><form class="form" id="form"><input id="name" placeholder="Name" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (8+ characters)" minlength="8" required><label><input id="updates" type="checkbox"> Send me FanOptic email updates</label><div id="teamArea"><b>Choose your teams</b><div class="pickerTop"><input id="teamSearch" placeholder="Search all teams"><span id="teamCount" class="tag">0 selected</span></div><div class="leaguebar"><button type="button" class="btn tabTeam" data-teamleague="All">All</button><button type="button" class="btn ghost tabTeam" data-teamleague="NFL">NFL</button><button type="button" class="btn ghost tabTeam" data-teamleague="NBA">NBA</button><button type="button" class="btn ghost tabTeam" data-teamleague="MLB">MLB</button><button type="button" class="btn ghost tabTeam" data-teamleague="NHL">NHL</button></div><div id="selected" class="selected"></div><div class="teamlist" id="teamlist"></div></div><div class="notice" id="notice"></div><button class="btn" id="submit">Create account</button></form></div></div><script>const teams={NFL:"Arizona Cardinals|Atlanta Falcons|Baltimore Ravens|Buffalo Bills|Carolina Panthers|Chicago Bears|Cincinnati Bengals|Cleveland Browns|Dallas Cowboys|Denver Broncos|Detroit Lions|Green Bay Packers|Houston Texans|Indianapolis Colts|Jacksonville Jaguars|Kansas City Chiefs|Las Vegas Raiders|Los Angeles Chargers|Los Angeles Rams|Miami Dolphins|Minnesota Vikings|New England Patriots|New Orleans Saints|New York Giants|New York Jets|Philadelphia Eagles|Pittsburgh Steelers|San Francisco 49ers|Seattle Seahawks|Tampa Bay Buccaneers|Tennessee Titans|Washington Commanders",NBA:"Atlanta Hawks|Boston Celtics|Brooklyn Nets|Charlotte Hornets|Chicago Bulls|Cleveland Cavaliers|Dallas Mavericks|Denver Nuggets|Detroit Pistons|Golden State Warriors|Houston Rockets|Indiana Pacers|Los Angeles Clippers|Los Angeles Lakers|Memphis Grizzlies|Miami Heat|Milwaukee Bucks|Minnesota Timberwolves|New Orleans Pelicans|New York Knicks|Oklahoma City Thunder|Orlando Magic|Philadelphia 76ers|Phoenix Suns|Portland Trail Blazers|Sacramento Kings|San Antonio Spurs|Toronto Raptors|Utah Jazz|Washington Wizards",MLB:"Arizona Diamondbacks|Atlanta Braves|Baltimore Orioles|Boston Red Sox|Chicago Cubs|Chicago White Sox|Cincinnati Reds|Cleveland Guardians|Colorado Rockies|Detroit Tigers|Houston Astros|Kansas City Royals|Los Angeles Angels|Los Angeles Dodgers|Miami Marlins|Milwaukee Brewers|Minnesota Twins|New York Mets|New York Yankees|Oakland Athletics|Philadelphia Phillies|Pittsburgh Pirates|San Diego Padres|San Francisco Giants|Seattle Mariners|St. Louis Cardinals|Tampa Bay Rays|Texas Rangers|Toronto Blue Jays|Washington Nationals",NHL:"Anaheim Ducks|Boston Bruins|Buffalo Sabres|Calgary Flames|Carolina Hurricanes|Chicago Blackhawks|Colorado Avalanche|Columbus Blue Jackets|Dallas Stars|Detroit Red Wings|Edmonton Oilers|Florida Panthers|Los Angeles Kings|Minnesota Wild|Montreal Canadiens|Nashville Predators|New Jersey Devils|New York Islanders|New York Rangers|Ottawa Senators|Philadelphia Flyers|Pittsburgh Penguins|San Jose Sharks|Seattle Kraken|St. Louis Blues|Tampa Bay Lightning|Toronto Maple Leafs|Utah Mammoth|Vancouver Canucks|Vegas Golden Knights|Washington Capitals|Winnipeg Jets"};let mode="signup",league="All",teamLeague="All",user=null,chosen=[],scoreMode="today",scorePage=0,scoreLeague="All",scoreQuery="";const $=id=>document.getElementById(id);function open(m){mode=m;$('modalTitle').textContent=m==='signup'?'Create your FanOptic account':'Log in to FanOptic';$('submit').textContent=m==='signup'?'Create account':'Log in';$('teamArea').style.display=m==='signup'?'block':'none';$('modal').classList.add('open');$('notice').textContent='';if(m==='signup')renderTeams()}function close(){$('modal').classList.remove('open')}$('signupBtn').onclick=()=>open('signup');$('loginBtn').onclick=()=>open('login');$('close').onclick=close;function renderTeams(){const q=$('teamSearch').value.toLowerCase();let out='';Object.entries(teams).forEach(([l,s])=>s.split('|').forEach(t=>{if((teamLeague==='All'||l===teamLeague)&&(!q||t.toLowerCase().includes(q)))out+='<label><input type="checkbox" value="'+t+'" data-l="'+l+'" '+(chosen.includes(t)?'checked':'')+'> '+t+' <small>('+l+')</small></label>'}));$('teamlist').innerHTML=out;$('teamlist').querySelectorAll('input').forEach(x=>x.onchange=()=>{chosen=x.checked?[...new Set([...chosen,x.value])]:chosen.filter(t=>t!==x.value);renderTeams()});$('teamCount').textContent=chosen.length+' selected';$('selected').innerHTML=chosen.map(t=>'<span class="pill">'+t+' ×</span>').join('')||'<span class="tag">Choose a few teams — you can change this later.</span>'}document.querySelectorAll('.tabTeam').forEach(b=>b.onclick=()=>{teamLeague=b.dataset.teamleague;document.querySelectorAll('.tabTeam').forEach(x=>x.classList.toggle('ghost',x!==b));renderTeams()});$('teamSearch').oninput=renderTeams;async function load(){const q=$('search').value.toLowerCase();let path='/api/articles?teams='+encodeURIComponent(user?user.teams.join(','):'National Headlines');const r=await fetch(path);const d=await r.json();$('feed').innerHTML=d.articles.filter(a=>(league==='All'||a.league===league)&&(!q||(a.title+' '+a.source+' '+a.team).toLowerCase().includes(q))).map(a=>{const stamp=a.date?new Date(a.date).toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):'Date unavailable';return '<article class="card"><div class="meta">'+a.league+' • '+a.team+' • '+a.source+'</div><h3><a target="_blank" rel="noopener" href="'+a.link+'" onclick="track(\'article_clicked\')">'+a.title+'</a></h3><div class="tag">'+(a.author?'By '+a.author+' • ':'')+stamp+' • Original article ↗</div></article>'}).join('')||'<div class="card">No headlines match that search.</div>'}async function track(event){fetch('/api/analytics',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({event})}).catch(()=>{})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{league=b.dataset.league;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('ghost',x!==b));load()});$('search').oninput=()=>{track('search_used');load()};let scoreGames=[],weekGames=[];const tileChars=s=>String(s).split('').map((c,i)=>'<span class="flapTile '+(c===' '?'space':'')+'"><span class="flapGlyph" style="animation-delay:'+(i*0.045)+'s">'+(c===' '?'&nbsp;':c.toUpperCase())+'</span></span>').join('');const teamText=s=>String(s).split(' ').map(w=>'<span class="tileWord">'+tileChars(w)+'</span>').join('<span class="teamSpace"></span>');const oddsText=s=>String(s).split(' ').map(w=>'<span class="tileWord">'+tileChars(w)+'</span>').join('<span class="teamSpace"></span>');function renderGame(g){const final=g.phase==='FINAL',awayScore=Number(g.awayScore),homeScore=Number(g.homeScore),awayWon=final&&awayScore>homeScore,homeWon=final&&homeScore>awayScore,status=g.phase||'SCHEDULED',phase=status==='FINAL'?'<span class="phaseTicker">'+tileChars('FINAL')+'</span>':status==='SCHEDULED'?'':'<span class="liveStatus">'+status+'</span>';return '<div class="score '+(g.favorite?'favorite':'')+'"><div class="boardMeta">'+(g.favorite?'★ ':'')+(g.day?g.day+' • ':'')+g.time+'</div><div class="tileLine"><span class="tileTeam '+(awayWon?'winner':'')+'">'+teamText(g.away)+(awayWon?'<span class="teamResult">W</span>':final?'<span class="teamResult loss">L</span>':'')+'</span><span class="tileAt">@</span><span class="tileTeam '+(homeWon?'winner':'')+'">'+teamText(g.home)+(homeWon?'<span class="teamResult">W</span>':final?'<span class="teamResult loss">L</span>':'')+'</span></div><div class="boardSub">'+phase+((g.awayScore!==''||g.homeScore!=='')?'<span class="liveScore">'+tileChars(g.awayScore+' - '+g.homeScore)+'</span>':'')+'</div><div class="boardUpdated">LIVE DATA • '+new Date(g.updated||Date.now()).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/New_York',timeZoneName:'short'})+'</div></div>';}function renderScores(){const allGames=scoreMode==='today'?scoreGames:weekGames,games=allGames.filter(g=>(scoreLeague==='All'||g.league===scoreLeague)&&(!scoreQuery||((g.away+' '+g.home+' '+g.league).toLowerCase().includes(scoreQuery)))),pages=Math.max(1,Math.ceil(games.length/4)),start=scorePage*4,page=games.slice(start,start+4);$('scoreTitle').textContent=scoreMode==='today'?"TODAY'S GAMES":"THIS WEEK";$('scorePage').textContent=(scorePage+1)+' / '+pages;$('scores').innerHTML=page.length?'<div class="scoreboard">'+page.map(renderGame).join('')+'</div>':'<div class="card">No games scheduled right now.</div>';$('scorePrev').disabled=scorePage===0;$('scoreNext').disabled=scorePage>=pages-1}async function loadScores(){try{const r=await fetch('/api/scores');const d=await r.json();scoreGames=Array.isArray(d.games)?d.games:[];weekGames=scoreGames;scorePage=0;renderScores()}catch{scoreGames=[];weekGames=[];renderScores()}}document.querySelectorAll('.scoreMode').forEach(b=>b.onclick=()=>{scoreMode=b.dataset.scoremode;scorePage=0;renderScores()});document.querySelectorAll('.scoreLeague').forEach(b=>b.onclick=()=>{scoreLeague=b.dataset.scoreleague;scorePage=0;document.querySelectorAll('.scoreLeague').forEach(x=>{x.classList.toggle('active',x===b);x.classList.toggle('ghost',x!==b)});renderScores()});$('scoreSearch').oninput=()=>{scoreQuery=$('scoreSearch').value.toLowerCase().trim();scorePage=0;renderScores()};$('scorePrev').onclick=()=>{if(scorePage>0){scorePage--;renderScores()}};$('scoreNext').onclick=()=>{const allGames=scoreMode==='today'?scoreGames:weekGames;const games=allGames.filter(g=>(scoreLeague==='All'||g.league===scoreLeague)&&(!scoreQuery||((g.away+' '+g.home+' '+g.league).toLowerCase().includes(scoreQuery))));const pages=Math.ceil(games.length/4);if(scorePage<pages-1){scorePage++;renderScores()}};renderScores();loadScores();setInterval(loadScores,60000);$('hideScores').onclick=()=>{$('scores').style.display=$('scores').style.display==='none'?'block':'none';$('hideScores').textContent=$('scores').style.display==='none'?'Show':'Hide'};$('form').onsubmit=async e=>{e.preventDefault();$('notice').textContent='Working…';const body={name:$('name').value,email:$('email').value,password:$('password').value,updates:$('updates').checked,teams:chosen};const r=await fetch(mode==='signup'?'/api/signup':'/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(mode==='signup'?body:{email:body.email,password:body.password})});const d=await r.json();if(!r.ok){$('notice').textContent=d.error||'Something went wrong';return}user=d.user;localStorage.setItem('fanoptic_user',JSON.stringify(user));if(d.token)localStorage.setItem('fanoptic_token',d.token);close();$('greeting').textContent='Hi '+user.name+'.';$('sub').textContent='Your feed is built around what you follow.';track('account_created');load()};load();</script></body></html>
