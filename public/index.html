<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FanOptic — Personalized Sports Coverage</title><style>:root{--g:#10251d;--d:#08130f;--c:#f3ead7;--y:#d7a84b;--m:#a9997b;--l:#3c4c40}*{box-sizing:border-box}body{margin:0;background:var(--d);color:var(--c);font:16px Georgia,serif}header{height:72px;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;background:var(--g);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:3}.brand{font:bold 30px Georgia;color:var(--y);letter-spacing:1px}.tag{font:12px Arial;color:var(--m);letter-spacing:2px;text-transform:uppercase}.btn{background:var(--y);color:#182019;border:0;border-radius:3px;padding:11px 16px;font-weight:bold;cursor:pointer}.ghost{background:transparent;color:var(--c);border:1px solid var(--y)}main{max-width:1180px;margin:auto;padding:26px 5%}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.hero h1{font-size:34px;margin:0 0 6px}.hero p{color:var(--m);margin:0}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}input{background:#192b22;color:var(--c);border:1px solid var(--l);padding:11px;border-radius:3px}#search{min-width:250px;flex:1}.grid{display:grid;grid-template-columns:1fr 285px;gap:22px}.card{background:var(--g);border:1px solid var(--l);padding:18px;margin-bottom:12px;border-radius:4px}.card h3{margin:0 0 8px;font-size:20px}.meta{font:12px Arial;color:var(--y);text-transform:uppercase;letter-spacing:1px}.card a{color:var(--c);text-decoration:none}.card a:hover{color:var(--y)}aside{background:#17271f;border:1px solid var(--l);padding:16px;height:max-content;position:sticky;top:90px}.score{border-bottom:1px solid var(--l);padding:12px 0;color:var(--m)}.score strong{display:block;color:var(--c)}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:5}.modal.open{display:grid}.box{background:var(--g);border:1px solid var(--y);padding:24px;width:min(600px,94vw);max-height:90vh;overflow:auto}.box h2{margin-top:0}.form{display:grid;gap:10px}.close{float:right;color:var(--m);cursor:pointer;font-size:22px}.notice{color:var(--y);min-height:20px;font:14px Arial}.pickerTop{display:flex;gap:8px;align-items:center;margin:12px 0 8px}.pickerTop input{flex:1;min-width:0}.leaguebar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.leaguebar button{padding:7px 10px}.selected{display:flex;gap:6px;flex-wrap:wrap;min-height:24px;margin:7px 0}.pill{background:#284636;color:var(--c);border:1px solid var(--y);border-radius:20px;padding:5px 9px;font:12px Arial}.teamlist{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:300px;overflow:auto;border-top:1px solid var(--l);padding-top:10px}.teamlist label{font:13px Arial;background:#1b3327;padding:9px;cursor:pointer;border:1px solid transparent}.teamlist label:hover{border-color:var(--y)}.teamlist input{accent-color:var(--y);padding:0;margin-right:4px}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{display:block}.hero .btn{margin-top:15px}aside{position:static}.teamlist{grid-template-columns:1fr}}</style></head><body><header><div><div class="brand">FANOPTIC</div><div class="tag">Personalized sports coverage</div></div><div><button class="btn ghost" id="loginBtn">Log in</button> <button class="btn" id="signupBtn">Create account</button></div></header><main><section class="hero"><div><h1 id="greeting">The sports desk, your way.</h1><p id="sub">National headlines now. Pick your teams when you are ready.</p></div><div class="tag">San Francisco • free to use</div></section><div class="tools"><input id="search" placeholder="Search teams, leagues, or headlines"><button class="btn tab" data-league="All">All</button><button class="btn ghost tab" data-league="NFL">NFL</button><button class="btn ghost tab" data-league="NBA">NBA</button><button class="btn ghost tab" data-league="MLB">MLB</button><button class="btn ghost tab" data-league="NHL">NHL</button></div><div class="grid"><section><div id="feed"></div></section><aside><div style="display:flex;justify-content:space-between;align-items:center"><b>LIVE SCOREBOARD</b><button class="btn ghost" id="hideScores">Hide</button></div><div id="scores"><div class="score"><strong>No games posted yet</strong>Home @ Away<br>Moneyline • Spread</div></div></aside></div></main><div class="modal" id="modal"><div class="box"><span class="close" id="close">×</span><h2 id="modalTitle">Create your FanOptic account</h2><form class="form" id="form"><input id="name" placeholder="Name" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (8+ characters)" minlength="8" required><label><input id="updates" type="checkbox"> Send me FanOptic email updates</label><div id="teamArea"><b>Choose your teams</b><div class="pickerTop"><input id="teamSearch" placeholder="Search all teams"><span id="teamCount" class="tag">0 selected</span></div><div class="leaguebar"><button type="button" class="btn tabTeam" data-teamleague="All">All</button><button type="button" class="btn ghost tabTeam" data-teamleague="NFL">NFL</button><button type="button" class="btn ghost tabTeam" data-teamleague="NBA">NBA</button><button type="button" class="btn ghost tabTeam" data-teamleague="MLB">MLB</button><button type="button" class="btn ghost tabTeam" data-teamleague="NHL">NHL</button></div><div id="selected" class="selected"></div><div class="teamlist" id="teamlist"></div></div><div class="notice" id="notice"></div><button class="btn" id="submit">Create account</button></form></div></div><script>const teams={NFL:"Arizona Cardinals|Atlanta Falcons|Baltimore Ravens|Buffalo Bills|Carolina Panthers|Chicago Bears|Cincinnati Bengals|Cleveland Browns|Dallas Cowboys|Denver Broncos|Detroit Lions|Green Bay Packers|Houston Texans|Indianapolis Colts|Jacksonville Jaguars|Kansas City Chiefs|Las Vegas Raiders|Los Angeles Chargers|Los Angeles Rams|Miami Dolphins|Minnesota Vikings|New England Patriots|New Orleans Saints|New York Giants|New York Jets|Philadelphia Eagles|Pittsburgh Steelers|San Francisco 49ers|Seattle Seahawks|Tampa Bay Buccaneers|Tennessee Titans|Washington Commanders",NBA:"Atlanta Hawks|Boston Celtics|Brooklyn Nets|Charlotte Hornets|Chicago Bulls|Cleveland Cavaliers|Dallas Mavericks|Denver Nuggets|Detroit Pistons|Golden State Warriors|Houston Rockets|Indiana Pacers|Los Angeles Clippers|Los Angeles Lakers|Memphis Grizzlies|Miami Heat|Milwaukee Bucks|Minnesota Timberwolves|New Orleans Pelicans|New York Knicks|Oklahoma City Thunder|Orlando Magic|Philadelphia 76ers|Phoenix Suns|Portland Trail Blazers|Sacramento Kings|San Antonio Spurs|Toronto Raptors|Utah Jazz|Washington Wizards",MLB:"Arizona Diamondbacks|Atlanta Braves|Baltimore Orioles|Boston Red Sox|Chicago Cubs|Chicago White Sox|Cincinnati Reds|Cleveland Guardians|Colorado Rockies|Detroit Tigers|Houston Astros|Kansas City Royals|Los Angeles Angels|Los Angeles Dodgers|Miami Marlins|Milwaukee Brewers|Minnesota Twins|New York Mets|New York Yankees|Oakland Athletics|Philadelphia Phillies|Pittsburgh Pirates|San Diego Padres|San Francisco Giants|Seattle Mariners|St. Louis Cardinals|Tampa Bay Rays|Texas Rangers|Toronto Blue Jays|Washington Nationals",NHL:"Anaheim Ducks|Boston Bruins|Buffalo Sabres|Calgary Flames|Carolina Hurricanes|Chicago Blackhawks|Colorado Avalanche|Columbus Blue Jackets|Dallas Stars|Detroit Red Wings|Edmonton Oilers|Florida Panthers|Los Angeles Kings|Minnesota Wild|Montreal Canadiens|Nashville Predators|New Jersey Devils|New York Islanders|New York Rangers|Ottawa Senators|Philadelphia Flyers|Pittsburgh Penguins|San Jose Sharks|Seattle Kraken|St. Louis Blues|Tampa Bay Lightning|Toronto Maple Leafs|Utah Mammoth|Vancouver Canucks|Vegas Golden Knights|Washington Capitals|Winnipeg Jets"};let mode="signup",league="All",teamLeague="All",user=null,chosen=[];const $=id=>document.getElementById(id);function open(m){mode=m;$('modalTitle').textContent=m==='signup'?'Create your FanOptic account':'Log in to FanOptic';$('submit').textContent=m==='signup'?'Create account':'Log in';$('teamArea').style.display=m==='signup'?'block':'none';$('modal').classList.add('open');$('notice').textContent='';if(m==='signup')renderTeams()}function close(){$('modal').classList.remove('open')}$('signupBtn').onclick=()=>open('signup');$('loginBtn').onclick=()=>open('login');$('close').onclick=close;function renderTeams(){const q=$('teamSearch').value.toLowerCase();let out='';Object.entries(teams).forEach(([l,s])=>s.split('|').forEach(t=>{if((teamLeague==='All'||l===teamLeague)&&(!q||t.toLowerCase().includes(q)))out+='<label><input type="checkbox" value="'+t+'" data-l="'+l+'" '+(chosen.includes(t)?'checked':'')+'> '+t+' <small>('+l+')</small></label>'}));$('teamlist').innerHTML=out;$('teamlist').querySelectorAll('input').forEach(x=>x.onchange=()=>{chosen=x.checked?[...new Set([...chosen,x.value])]:chosen.filter(t=>t!==x.value);renderTeams()});$('teamCount').textContent=chosen.length+' selected';$('selected').innerHTML=chosen.map(t=>'<span class="pill">'+t+' ×</span>').join('')||'<span class="tag">Choose a few teams — you can change this later.</span>'}document.querySelectorAll('.tabTeam').forEach(b=>b.onclick=()=>{teamLeague=b.dataset.teamleague;document.querySelectorAll('.tabTeam').forEach(x=>x.classList.toggle('ghost',x!==b));renderTeams()});$('teamSearch').oninput=renderTeams;async function load(){const q=$('search').value.toLowerCase();let path='/api/articles?teams='+encodeURIComponent(user?user.teams.join(','):'National Headlines');const r=await fetch(path);const d=await r.json();$('feed').innerHTML=d.articles.filter(a=>(league==='All'||a.league===league)&&(!q||(a.title+' '+a.source+' '+a.team).toLowerCase().includes(q))).map(a=>'<article class="card"><div class="meta">'+a.league+' • '+a.team+' • '+a.source+'</div><h3><a target="_blank" rel="noopener" href="'+a.link+'" onclick="track(\'article_clicked\')">'+a.title+'</a></h3><div class="tag">Original article ↗</div></article>').join('')||'<div class="card">No headlines match that search.</div>'}async function track(event){fetch('/api/analytics',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({event})}).catch(()=>{})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{league=b.dataset.league;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('ghost',x!==b));load()});$('search').oninput=()=>{track('search_used');load()};$('hideScores').onclick=()=>{$('scores').style.display=$('scores').style.display==='none'?'block':'none';$('hideScores').textContent=$('scores').style.display==='none'?'Show':'Hide'};$('form').onsubmit=async e=>{e.preventDefault();$('notice').textContent='Working…';const body={name:$('name').value,email:$('email').value,password:$('password').value,updates:$('updates').checked,teams:chosen};const r=await fetch(mode==='signup'?'/api/signup':'/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(mode==='signup'?body:{email:body.email,password:body.password})});const d=await r.json();if(!r.ok){$('notice').textContent=d.error||'Something went wrong';return}const signedUp=mode==='signup';user=d.user;localStorage.setItem('fanoptic_user',JSON.stringify(user));if(d.token)localStorage.setItem('fanoptic_token',d.token);close();$('greeting').textContent='Hi '+user.name+'.';$('sub').textContent=signedUp?(d.emailStatus?.sent?'Resend accepted your welcome email request. Your feed is built around what you follow.':'Your account is saved, but the welcome email could not be sent. Your feed is ready.'):'Your feed is built around what you follow.';if(signedUp)track('account_created');load()};load();</script></body></html>
