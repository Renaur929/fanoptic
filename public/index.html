<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FanOptic — Personalized Sports Coverage</title><style>:root{--g:#10251d;--d:#08130f;--c:#f3ead7;--y:#d7a84b;--m:#a9997b;--l:#3c4c40}*{box-sizing:border-box}body{margin:0;background:var(--d);color:var(--c);font:16px Georgia,serif}header{height:72px;padding:16px 5%;display:flex;align-items:center;justify-content:space-between;background:var(--g);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:3}.brand{font:bold 30px Georgia;color:var(--y);letter-spacing:1px}.tag{font:12px Arial;color:var(--m);letter-spacing:2px;text-transform:uppercase}.btn{background:var(--y);color:#182019;border:0;border-radius:3px;padding:11px 16px;font-weight:bold;cursor:pointer}.ghost{background:transparent;color:var(--c);border:1px solid var(--y)}main{max-width:1180px;margin:auto;padding:26px 5%}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:22px}.hero h1{font-size:34px;margin:0 0 6px}.hero p{color:var(--m);margin:0}.tools{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}input{background:#192b22;color:var(--c);border:1px solid var(--l);padding:11px;border-radius:3px}#search{min-width:250px;flex:1}.grid{display:grid;grid-template-columns:1fr 285px;gap:22px}.card{background:var(--g);border:1px solid var(--l);padding:18px;margin-bottom:12px;border-radius:4px}.card h3{margin:0 0 8px;font-size:20px}.meta{font:12px Arial;color:var(--y);text-transform:uppercase;letter-spacing:1px}.card a{color:var(--c);text-decoration:none}.card a:hover{color:var(--y)}aside{background:#17271f;border:1px solid var(--l);padding:16px;height:max-content;position:sticky;top:90px}.score{border-bottom:1px solid var(--l);padding:12px 0;color:var(--m)}.score strong{display:block;color:var(--c)}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:5}.modal.open{display:grid}.box{background:var(--g);border:1px solid var(--y);padding:24px;width:min(600px,94vw);max-height:90vh;overflow:auto}.box h2{margin-top:0}.form{display:grid;gap:10px}.close{float:right;color:var(--m);cursor:pointer;font-size:22px}.notice{color:var(--y);min-height:20px;font:14px Arial}.pickerTop{display:flex;gap:8px;align-items:center;margin:12px 0 8px}.pickerTop input{flex:1;min-width:0}.leaguebar{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.leaguebar button{padding:7px 10px}.selected{display:flex;gap:6px;flex-wrap:wrap;min-height:24px;margin:7px 0}.pill{background:#284636;color:var(--c);border:1px solid var(--y);border-radius:20px;padding:5px 9px;font:12px Arial}.teamlist{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;max-height:300px;overflow:auto;border-top:1px solid var(--l);padding-top:10px}.teamlist label{font:13px Arial;background:#1b3327;padding:9px;cursor:pointer;border:1px solid transparent}.teamlist label:hover{border-color:var(--y)}.teamlist input{accent-color:var(--y);padding:0;margin-right:4px}@media(max-width:800px){.grid{grid-template-columns:1fr}.hero{display:block}.hero .btn{margin-top:15px}aside{position:static}.teamlist{grid-template-columns:1fr}}.scoreTools{display:flex;gap:6px;margin:10px 0}.scoreTools .btn{padding:7px 9px;font-size:12px}.scorePage{display:flex;justify-content:space-between;align-items:center;margin:2px 0 4px;color:var(--m);font:12px Arial;text-transform:uppercase;letter-spacing:1px}.scoreArrow{padding:4px 8px!important}.scoreArrow:disabled{opacity:.35;cursor:not-allowed}.score strong{font-size:15px}.score small{display:block;margin-top:5px;color:var(--m);font:11px Arial;text-transform:none;letter-spacing:0}.scoreLine{color:var(--c);font-size:15px;margin:4px 0}.score.favorite{border-left:3px solid var(--y);padding-left:9px}.tickerWindow{display:inline-block;overflow:hidden;vertical-align:bottom}.flipChar{display:inline-block;min-width:.34em;animation:tickerFlip .48s cubic-bezier(.2,.75,.3,1) both;transform-origin:50% 0}.flipChar.space{min-width:.18em}@keyframes tickerFlip{0%{opacity:0;transform:translateY(-115%) rotateX(-80deg)}55%{opacity:1;transform:translateY(8%) rotateX(12deg)}100%{opacity:1;transform:translateY(0) rotateX(0)}}<style>aside{background:#11100f;border:1px solid #38312a;padding:14px;height:max-content;position:sticky;top:90px;box-shadow:0 8px 22px #0008}.grid{grid-template-columns:1fr 360px}.scoreboard{background:#0b0b0b;border:1px solid #393632;box-shadow:inset 0 0 0 4px #171614}.score{border-bottom:1px solid #35322e;padding:11px 9px 13px;color:var(--m);background:#11100f}.score:last-child{border-bottom:0}.score.favorite{border-left:4px solid var(--y);padding-left:6px}.boardMeta{font:11px Arial,sans-serif;letter-spacing:1.7px;text-transform:uppercase;color:var(--y);margin-bottom:6px}.tileLine,.boardSub{display:flex;flex-wrap:wrap;gap:0;line-height:1}.flapTile{position:relative;display:inline-flex;align-items:center;justify-content:center;width:18px;height:24px;background:#171616;color:#f3ead7;border:1px solid #35302d;border-top-color:#514a45;font:700 12px/1 "Courier New",monospace;box-shadow:inset 0 2px 0 #262321,inset 0 -3px 0 #090909;perspective:180px;animation:flapIn .42s cubic-bezier(.2,.75,.3,1) both}.flapTile:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#080808;box-shadow:0 1px #38312d}.flapTile span{position:relative;z-index:1}.flapTile.space{background:#0b0b0b;border-color:#0b0b0b;width:8px}.boardSub{margin-top:5px}.boardSub .flapTile{width:16px;height:20px;font-size:10px;color:#d7a84b}.boardSub .flapTile.space{width:6px}.boardUpdated{font:10px Arial,sans-serif;letter-spacing:.3px;color:#a9997b;margin-top:7px;text-transform:uppercase}@keyframes flapIn{0%{opacity:0;transform:rotateX(-86deg);filter:brightness(1.7)}55%{opacity:1;transform:rotateX(12deg);filter:brightness(1.25)}100%{opacity:1;transform:rotateX(0);filter:brightness(1)}}@media(max-width:800px){.grid{grid-template-columns:1fr}aside{position:static}.flapTile{width:19px;height:25px}.boardSub .flapTile{width:17px}}</style></style></head><body><header><div><div class="brand">FANOPTIC</div><div class="tag">Personalized sports coverage</div></div><div><button class="btn ghost" id="loginBtn">Log in</button> <button class="btn" id="signupBtn">Create account</button></div></header><main><section class="hero"><div><h1 id="greeting">The sports desk, your way.</h1><p id="sub">National headlines now. Pick your teams when you are ready.</p></div><div class="tag">San Francisco • free to use</div></section><div class="tools"><input id="search" placeholder="Search teams, leagues, or headlines"><button class="btn tab" data-league="All">All</button><button class="btn ghost tab" data-league="NFL">NFL</button><button class="btn ghost tab" data-league="NBA">NBA</button><button class="btn ghost tab" data-league="MLB">MLB</button><button class="btn ghost tab" data-league="NHL">NHL</button></div><div class="grid"><section><div id="feed"></div></section><aside><div style="display:flex;justify-content:space-between;align-items:center"><b id="scoreTitle">TODAY'S GAMES</b><button class="btn ghost" id="hideScores">Hide</button></div><div class="scoreTools"><button class="btn scoreMode" data-scoremode="today">Today</button><button class="btn ghost scoreMode" data-scoremode="week">This week</button></div><div class="scorePage"><button class="btn ghost scoreArrow" id="scorePrev" aria-label="Previous games">‹</button><span id="scorePage">1 / 2</span><button class="btn ghost scoreArrow" id="scoreNext" aria-label="Next games">›</button></div><div id="scores"></div></aside></div></main><div class="modal" id="modal"><div class="box"><span class="close" id="close">×</span><h2 id="modalTitle">Create your FanOptic account</h2><form class="form" id="form"><input id="name" placeholder="Name" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password (8+ characters)" minlength="8" required><label><input id="updates" type="checkbox"> Send me FanOptic email updates</label><div id="teamArea"><b>Choose your teams</b><div class="pickerTop"><input id="teamSearch" placeholder="Search all teams"><span id="teamCount" class="tag">0 selected</span></div><div class="leaguebar"><button type="button" class="btn tabTeam" data-teamleague="All">All</button><button type="button" class="btn ghost tabTeam" data-teamleague="NFL">NFL</button><button type="button" class="btn ghost tabTeam" data-teamleague="NBA">NBA</button><button type="button" class="btn ghost tabTeam" data-teamleague="MLB">MLB</button><button type="button" class="btn ghost tabTeam" data-teamleague="NHL">NHL</button></div><div id="selected" class="selected"></div><div class="teamlist" id="teamlist"></div></div><div class="notice" id="notice"></div><button class="btn" id="submit">Create account</button></form></div></div><script>const teams={NFL:"Arizona Cardinals|Atlanta Falcons|Baltimore Ravens|Buffalo Bills|Carolina Panthers|Chicago Bears|Cincinnati Bengals|Cleveland Browns|Dallas Cowboys|Denver Broncos|Detroit Lions|Green Bay Packers|Houston Texans|Indianapolis Colts|Jacksonville Jaguars|Kansas City Chiefs|Las Vegas Raiders|Los Angeles Chargers|Los Angeles Rams|Miami Dolphins|Minnesota Vikings|New England Patriots|New Orleans Saints|New York Giants|New York Jets|Philadelphia Eagles|Pittsburgh Steelers|San Francisco 49ers|Seattle Seahawks|Tampa Bay Buccaneers|Tennessee Titans|Washington Commanders",NBA:"Atlanta Hawks|Boston Celtics|Brooklyn Nets|Charlotte Hornets|Chicago Bulls|Cleveland Cavaliers|Dallas Mavericks|Denver Nuggets|Detroit Pistons|Golden State Warriors|Houston Rockets|Indiana Pacers|Los Angeles Clippers|Los Angeles Lakers|Memphis Grizzlies|Miami Heat|Milwaukee Bucks|Minnesota Timberwolves|New Orleans Pelicans|New York Knicks|Oklahoma City Thunder|Orlando Magic|Philadelphia 76ers|Phoenix Suns|Portland Trail Blazers|Sacramento Kings|San Antonio Spurs|Toronto Raptors|Utah Jazz|Washington Wizards",MLB:"Arizona Diamondbacks|Atlanta Braves|Baltimore Orioles|Boston Red Sox|Chicago Cubs|Chicago White Sox|Cincinnati Reds|Cleveland Guardians|Colorado Rockies|Detroit Tigers|Houston Astros|Kansas City Royals|Los Angeles Angels|Los Angeles Dodgers|Miami Marlins|Milwaukee Brewers|Minnesota Twins|New York Mets|New York Yankees|Oakland Athletics|Philadelphia Phillies|Pittsburgh Pirates|San Diego Padres|San Francisco Giants|Seattle Mariners|St. Louis Cardinals|Tampa Bay Rays|Texas Rangers|Toronto Blue Jays|Washington Nationals",NHL:"Anaheim Ducks|Boston Bruins|Buffalo Sabres|Calgary Flames|Carolina Hurricanes|Chicago Blackhawks|Colorado Avalanche|Columbus Blue Jackets|Dallas Stars|Detroit Red Wings|Edmonton Oilers|Florida Panthers|Los Angeles Kings|Minnesota Wild|Montreal Canadiens|Nashville Predators|New Jersey Devils|New York Islanders|New York Rangers|Ottawa Senators|Philadelphia Flyers|Pittsburgh Penguins|San Jose Sharks|Seattle Kraken|St. Louis Blues|Tampa Bay Lightning|Toronto Maple Leafs|Utah Mammoth|Vancouver Canucks|Vegas Golden Knights|Washington Capitals|Winnipeg Jets"};let mode="signup",league="All",teamLeague="All",user=null,chosen=[],scoreMode="today",scorePage=0;const $=id=>document.getElementById(id);function open(m){mode=m;$('modalTitle').textContent=m==='signup'?'Create your FanOptic account':'Log in to FanOptic';$('submit').textContent=m==='signup'?'Create account':'Log in';$('teamArea').style.display=m==='signup'?'block':'none';$('modal').classList.add('open');$('notice').textContent='';if(m==='signup')renderTeams()}function close(){$('modal').classList.remove('open')}$('signupBtn').onclick=()=>open('signup');$('loginBtn').onclick=()=>open('login');$('close').onclick=close;function renderTeams(){const q=$('teamSearch').value.toLowerCase();let out='';Object.entries(teams).forEach(([l,s])=>s.split('|').forEach(t=>{if((teamLeague==='All'||l===teamLeague)&&(!q||t.toLowerCase().includes(q)))out+='<label><input type="checkbox" value="'+t+'" data-l="'+l+'" '+(chosen.includes(t)?'checked':'')+'> '+t+' <small>('+l+')</small></label>'}));$('teamlist').innerHTML=out;$('teamlist').querySelectorAll('input').forEach(x=>x.onchange=()=>{chosen=x.checked?[...new Set([...chosen,x.value])]:chosen.filter(t=>t!==x.value);renderTeams()});$('teamCount').textContent=chosen.length+' selected';$('selected').innerHTML=chosen.map(t=>'<span class="pill">'+t+' ×</span>').join('')||'<span class="tag">Choose a few teams — you can change this later.</span>'}document.querySelectorAll('.tabTeam').forEach(b=>b.onclick=()=>{teamLeague=b.dataset.teamleague;document.querySelectorAll('.tabTeam').forEach(x=>x.classList.toggle('ghost',x!==b));renderTeams()});$('teamSearch').oninput=renderTeams;async function load(){const q=$('search').value.toLowerCase();let path='/api/articles?teams='+encodeURIComponent(user?user.teams.join(','):'National Headlines');const r=await fetch(path);const d=await r.json();$('feed').innerHTML=d.articles.filter(a=>(league==='All'||a.league===league)&&(!q||(a.title+' '+a.source+' '+a.team).toLowerCase().includes(q))).map(a=>{const stamp=a.date?new Date(a.date).toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'numeric',minute:'2-digit'}):'Date unavailable';return '<article class="card"><div class="meta">'+a.league+' • '+a.team+' • '+a.source+'</div><h3><a target="_blank" rel="noopener" href="'+a.link+'" onclick="track(\'article_clicked\')">'+a.title+'</a></h3><div class="tag">'+(a.author?'By '+a.author+' • ':'')+stamp+' • Original article ↗</div></article>'}).join('')||'<div class="card">No headlines match that search.</div>'}async function track(event){fetch('/api/analytics',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({event})}).catch(()=>{})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{league=b.dataset.league;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('ghost',x!==b));load()});$('search').oninput=()=>{track('search_used');load()};const scoreGames=[{favorite:true,league:'NFL',away:'Denver Broncos',home:'Kansas City Chiefs',time:'5:15 PM',spread:'DEN +3.5',ml:'DEN +135 / KC -155',updated:'Odds updated 11:42 AM'},{favorite:true,league:'NBA',away:'Denver Nuggets',home:'Los Angeles Lakers',time:'7:00 PM',spread:'DEN -2.5',ml:'DEN -145 / LAL +125',updated:'Odds updated 11:39 AM'},{favorite:true,league:'MLB',away:'Los Angeles Angels',home:'Texas Rangers',time:'7:05 PM',spread:'LAA +1.5',ml:'LAA +120 / TEX -140',updated:'Odds updated 11:35 AM'},{favorite:true,league:'NHL',away:'Anaheim Ducks',home:'Los Angeles Kings',time:'7:30 PM',spread:'ANA +1.5',ml:'ANA +125 / LA -145',updated:'Odds updated 11:31 AM'},{favorite:false,league:'NFL',away:'Buffalo Bills',home:'Miami Dolphins',time:'6:15 PM',spread:'BUF -3.5',ml:'BUF -170 / MIA +145',updated:'Odds updated 11:28 AM'},{favorite:false,league:'NBA',away:'Boston Celtics',home:'New York Knicks',time:'4:30 PM',spread:'BOS -4.5',ml:'BOS -185 / NYK +155',updated:'Odds updated 11:20 AM'},{favorite:false,league:'MLB',away:'Chicago Cubs',home:'Los Angeles Dodgers',time:'6:10 PM',spread:'LAD -1.5',ml:'LAD -125 / CHC +105',updated:'Odds updated 11:16 AM'},{favorite:false,league:'NHL',away:'Toronto Maple Leafs',home:'Montreal Canadiens',time:'4:00 PM',spread:'TOR -1.5',ml:'TOR -155 / MTL +135',updated:'Odds updated 11:08 AM'}];const weekGames=[...scoreGames,{favorite:false,league:'NBA',away:'Golden State Warriors',home:'Phoenix Suns',time:'THU • 7:00 PM',spread:'GSW +2.5',ml:'GSW +115 / PHX -135',updated:'Odds updated Wed 10:54 AM'},{favorite:false,league:'MLB',away:'New York Yankees',home:'Boston Red Sox',time:'FRI • 4:10 PM',spread:'NYY -1.5',ml:'NYY -120 / BOS +100',updated:'Odds updated Wed 10:41 AM'}];const tileText=s=>String(s).split('').map((c,i)=>'<span class="flapTile '+(c===' '?'space':'')+'" style="animation-delay:'+(i*0.012)+'s"><span>'+(c===' '?'&nbsp;':c)+'</span></span>').join('');function renderScores(){const games=scoreMode==='today'?scoreGames:weekGames,pages=Math.max(1,Math.ceil(games.length/4)),start=scorePage*4,page=games.slice(start,start+4);$('scoreTitle').textContent=scoreMode==='today'?"TODAY'S GAMES":"THIS WEEK";$('scorePage').textContent=(scorePage+1)+' / '+pages;$('scores').innerHTML='<div class="scoreboard">'+page.map(g=>'<div class="score '+(g.favorite?'favorite':'')+'"><div class="boardMeta">'+(g.favorite?'★ ':'')+g.league+' • '+g.time+'</div><div class="tileLine">'+tileText(g.away+' @ '+g.home)+'</div><div class="boardSub">'+tileText(g.spread+' • '+g.ml)+'</div><div class="boardUpdated">'+g.updated+'</div></div>').join('')+'</div>';$('scorePrev').disabled=scorePage===0;$('scoreNext').disabled=scorePage>=pages-1}document.querySelectorAll('.scoreMode').forEach(b=>b.onclick=()=>{scoreMode=b.dataset.scoremode;scorePage=0;document.querySelectorAll('.scoreMode').forEach(x=>x.classList.toggle('ghost',x!==b));renderScores()});$('scorePrev').onclick=()=>{if(scorePage>0){scorePage--;renderScores()}};$('scoreNext').onclick=()=>{const pages=Math.ceil((scoreMode==='today'?scoreGames:weekGames).length/4);if(scorePage<pages-1){scorePage++;renderScores()}};renderScores();$('hideScores').onclick=()=>{$('scores').style.display=$('scores').style.display==='none'?'block':'none';$('hideScores').textContent=$('scores').style.display==='none'?'Show':'Hide'};$('form').onsubmit=async e=>{e.preventDefault();$('notice').textContent='Working…';const body={name:$('name').value,email:$('email').value,password:$('password').value,updates:$('updates').checked,teams:chosen};const r=await fetch(mode==='signup'?'/api/signup':'/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(mode==='signup'?body:{email:body.email,password:body.password})});const d=await r.json();if(!r.ok){$('notice').textContent=d.error||'Something went wrong';return}user=d.user;localStorage.setItem('fanoptic_user',JSON.stringify(user));if(d.token)localStorage.setItem('fanoptic_token',d.token);close();$('greeting').textContent='Hi '+user.name+'.';$('sub').textContent='Your feed is built around what you follow.';track('account_created');load()};load();</script></body></html>
