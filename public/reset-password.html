<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset your password — FanOptic</title><style>:root{--g:#10251d;--d:#08130f;--c:#f3ead7;--y:#d7a84b;--m:#a9997b;--l:#3c4c40}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--d);color:var(--c);font:16px Georgia,serif;display:grid;place-items:center}.box{width:min(480px,92vw);background:var(--g);border:1px solid var(--y);padding:28px}h1{margin:0;color:var(--y);letter-spacing:2px}p{color:var(--m);line-height:1.5}form{display:grid;gap:12px}input{background:#192b22;color:var(--c);border:1px solid var(--l);padding:12px;border-radius:3px;font-size:16px}.btn{background:var(--y);color:#182019;border:0;border-radius:3px;padding:12px 16px;font-weight:bold;cursor:pointer}.notice{min-height:20px;color:var(--y);font:14px Arial}a{color:var(--y)}</style></head><body><main class="box"><h1>FANOPTIC</h1><p>Choose a new password for your account.</p><form id="resetForm"><input id="password" type="password" autocomplete="new-password" minlength="8" placeholder="New password (8+ characters)" required><input id="confirm" type="password" autocomplete="new-password" minlength="8" placeholder="Confirm new password" required><div class="notice" id="notice"></div><button class="btn" type="submit">Reset password</button></form><p><a href="/">Back to FanOptic</a></p></main><script>const token=new URLSearchParams(location.search).get("token");const notice=document.getElementById("notice");if(!token)notice.textContent="This reset link is missing or invalid. Request a new one from the login window.";document.getElementById("resetForm").onsubmit=async e=>{e.preventDefault();if(!token){notice.textContent="This reset link is missing or invalid.";return}if(document.getElementById("password").value!==document.getElementById("confirm").value){notice.textContent="The passwords do not match.";return}notice.textContent="Updating password…";try{const r=await fetch("/api/password-reset/complete",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({token,password:document.getElementById("password").value})});const d=await r.json();if(!r.ok){notice.textContent=d.error||"This reset link could not be used.";return}document.getElementById("resetForm").style.display="none";notice.textContent=d.message||"Password updated. You can now log in."}catch{notice.textContent="Could not contact FanOptic. Try again."}};</script></body></html>
